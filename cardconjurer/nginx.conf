# PROVENANCE: captured 2026-11-23 from 172.17.1.216
#   /conf/joshbirnholz-cardconjurer/docker/app.override.conf
# (the untracked local modification of the upstream repo — now owned here).
#
# CHANGES vs the captured file:
#   - `listen 4241; listen 4243; listen 4244;` added so ONE container serves
#     the four ports that were five separate nginx containers on .216.
#   - nothing else. Behavior (paths, caching, PUT) is intentionally identical
#     so the A/B in ../bringup.md is a valid byte-identity test.
#
# KNOWN GAP (pre-existing, kept as-is for v1): the ccAutomator client sends
# an `X-Upload-Secret` header but this conf does not enforce it — PUTs are
# open on the LAN, same as today. Hardening is a follow-up, not a v1 change.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    keepalive_timeout  65;
    gzip  on;
    server {
        listen 4241;
        listen 4242 default_server;
        listen 4243;
        listen 4244;
        server_name localhost;
        root  /usr/share/nginx/html;
        index index.html index.htm;

        # Upload location for images - using exact prefix match
        location ^~ /local_art/ {
            root /usr/share/nginx/html/;

            client_body_temp_path /tmp/client_temp;
            client_max_body_size 200M;
            dav_methods PUT DELETE MKCOL COPY MOVE; # Enable methods
            dav_access user:rw group:rw all:r;    # Permissions for new files/dirs

            create_full_put_path on; # Allow creation of subdirectories on PUT
            autoindex on;
        }

        location ~* \.(?:manifest|appcache|html?|xml|json)$ {
          expires -1;
        }
        location ~* \.(?:css|js)$ {
          try_files $uri =404;
          expires 1y;
          access_log off;
          add_header Cache-Control "public";
        }
        # Any route containing a file extension (e.g. /devicesfile.js)
        location ~ ^.+\..+$ {
          try_files $uri =404;
        }
        # Any route that doesn't have a file extension (e.g. /devices)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
